<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>설치 사례</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">

    <style>
        /* --- 설치사례 섹션 스타일 --- */
        .install-section {
            padding: 50px 30px;
            background-color: #f9f9f9;
        }

        .install-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #333;
        }

        .case-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .case-card {
            width: 100%;
            max-width: 320px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s;
        }

        .case-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .case-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .case-name {
            padding: 15px;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<section class="install-section">
    <h2 class="install-title">설치사례</h2>
    <div class="case-container">
        <div class="case-card" th:each="c : ${cases}">
            <img th:src="${c.image}" alt="설치사례 이미지">
            <div class="case-name" th:text="${c.name}">지점명</div>
        </div>
    </div>
</section>
</body>
</html>
